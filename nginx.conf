server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;  # Matches any server name

      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      # Example CSP only; tune connect-src for orchestrator API and ws:/wss: MQTT before enabling:
      # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https: ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" always;

      # entrypoint.sh rewrites these bundles with runtime MQTT settings on every start,
      # so they keep their hashed name but must be revalidated.
      location ~ ^/assets/index[^/]*\.js(\.map)?$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      }

      location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      }

      location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache" always;
        # add_header in a location disables inheritance of the server-level headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      }
}
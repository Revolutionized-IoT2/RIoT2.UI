name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    uses: Revolutionized-IoT2/.github/.github/workflows/node-validate.yml@main
    with:
      node-version: "24"
      # build runs vue-tsc first, so it also type-checks.
      scripts: test build
      # tests/contracts.test.cjs reads the golden files and the orchestrator's OpenAPI document.
      siblings: RIoT2.Core RIoT2.Net.Orchestrator

  image:
    uses: Revolutionized-IoT2/.github/.github/workflows/docker-publish.yml@main
    with:
      image: riot2-ui

  secret-scan:
    uses: Revolutionized-IoT2/.github/.github/workflows/secret-scan.yml@main
